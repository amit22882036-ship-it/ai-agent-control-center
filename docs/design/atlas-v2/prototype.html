<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas V2 design reference (prototype, not the application)</title>
<!-- Approved Stage 2J design reference. A static prototype with fictional data: it is not the working
     application and talks to no backend. Only this prototype loads fonts from Google Fonts. -->
<!-- Isolated design prototype. Fictional data. No backend, no providers, no network calls except web fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Heebo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Hanken Grotesk","Heebo","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;--r-sm:7px;--ease:cubic-bezier(.2,.75,.2,1);--insp-w:404px;--olw:300px;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F3F2EE;--rail:#FAF9F6;--surface:#FFFFFF;--surface-2:#FBFAF8;--sunken:#EFEDE8;--hover:#F5F3EF;--hover-2:#EBE8E2;
  --line:#E3E0D9;--line-2:#D1CDC4;--line-3:#EEEBE5;
  --text:#18191C;--text-2:#4D5058;--text-3:#6F727B;--text-4:#A2A4AB;
  --ink:#18191C;--on-ink:#FFFFFF;
  --accent:#3858D6;--accent-soft:rgba(56,88,214,.08);--accent-line:rgba(56,88,214,.38);
  --thread:#CBB494;--thread-soft:#E6DACB;
  --work:#15895A;--work-soft:rgba(21,137,90,.12);
  --ask:#9A6200;--ask-fill:#F0B232;--ask-soft:#FEF4DA;--ask-line:#EED18A;
  --block:#B0522A;--fail:#C73434;--fail-soft:#FCEDEB;--done:#5C5F67;--gone:#9A9CA3;
  --map:#F7F6F2;--dot:rgba(140,112,72,.16);
  --shadow-1:0 1px 2px rgba(24,25,28,.05),0 2px 8px rgba(24,25,28,.04);
  --shadow-2:0 12px 32px rgba(24,25,28,.12),0 2px 8px rgba(24,25,28,.06);
  --shadow-3:0 28px 72px rgba(24,25,28,.2),0 6px 18px rgba(24,25,28,.08);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0E0F12;--rail:#121317;--surface:#16171B;--surface-2:#191A1F;--sunken:#111216;--hover:#1B1C21;--hover-2:#24252B;
  --line:#25272D;--line-2:#34373F;--line-3:#1E1F24;
  --text:#ECEDF0;--text-2:#ACAFB7;--text-3:#82868F;--text-4:#565A63;
  --ink:#ECEDF0;--on-ink:#121316;
  --accent:#90A7FF;--accent-soft:rgba(144,167,255,.10);--accent-line:rgba(144,167,255,.45);
  --thread:#5E5241;--thread-soft:#3A3329;
  --work:#48D08C;--work-soft:rgba(72,208,140,.14);
  --ask:#F4BF52;--ask-fill:#F4BF52;--ask-soft:rgba(244,191,82,.08);--ask-line:rgba(244,191,82,.32);
  --block:#F0925F;--fail:#FF726C;--fail-soft:rgba(255,114,108,.10);--done:#A5A9B2;--gone:#6C707A;
  --map:#111216;--dot:rgba(214,190,156,.08);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-2:0 14px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);--shadow-3:0 30px 80px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,h4,p{margin:0}:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}.num{font-variant-numeric:tabular-nums}
.bidi{unicode-bidi:plaintext}.iso{unicode-bidi:isolate}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;flex:none}.sp{flex:1}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh}
.topbar{display:flex;align-items:center;gap:4px;padding:0 14px 0 16px;background:var(--rail);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:18px;white-space:nowrap}
.brand .proto{font-weight:600;font-size:11px;color:var(--text-3);border:1px dashed var(--line-2);border-radius:999px;padding:2px 8px}
.nav{display:flex;align-self:stretch}
.nav button{position:relative;padding:0 12px;color:var(--text-2);font-weight:600;white-space:nowrap}
.nav button:hover{color:var(--text)}
.nav button[aria-current=page]{color:var(--text)}
.nav button[aria-current=page]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.nav .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--ask-fill);color:#2a1b00;font-size:11px;font-weight:700}
.search{display:flex;align-items:center;gap:9px;width:270px;height:34px;padding:0 8px 0 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--text-3)}
.search:hover{border-color:var(--line-2)}
.search .lbl{flex:1;white-space:nowrap;overflow:hidden}
.kbd{font:500 10.5px/1 var(--mono);padding:3px 5px 2px;border-radius:4px;border:1px solid var(--line-2);border-bottom-width:2px;color:var(--text-3);background:var(--sunken)}
.needs{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 9px;margin-left:6px;border-radius:9px;background:var(--ask-soft);border:1px solid var(--ask-line);color:var(--ask);font-weight:600;white-space:nowrap}
.needs:hover{filter:brightness(1.03)}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);flex:none}
.ib:hover{background:var(--hover-2);color:var(--text)}
.ib.sm{width:28px;height:28px;border-radius:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover-2)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover-2);color:var(--text)}
.btn.ask{background:var(--ask-fill);border-color:var(--ask-fill);color:#2a1b00}
.btn.danger{color:var(--fail)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .kbd{background:transparent;border-color:color-mix(in srgb,currentColor 30%,transparent);color:inherit;opacity:.7}

/* ---------- avatars, beads, status vocabulary ---------- */
.av{--s:30px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--c);color:#17181B;font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:.01em}
.av .tb{position:absolute;right:calc(var(--s)*-.12);bottom:calc(var(--s)*-.1);min-width:calc(var(--s)*.46);height:calc(var(--s)*.46);padding:0 2px;border-radius:calc(var(--s)*.14);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);font:700 calc(var(--s)*.2)/1 var(--font);color:var(--text-2);font-style:normal}
.av.gone{filter:grayscale(1);opacity:.5}
.bead{flex:none;width:16px;height:16px;display:grid;place-items:center}
.t-work{color:var(--work)}.t-ask{color:var(--ask)}.t-idle{color:var(--text-2)}.t-block{color:var(--block)}.t-fail{color:var(--fail)}.t-done{color:var(--text-2)}.t-gone{color:var(--text-3)}.t-review{color:var(--work)}
.pulse{transform-origin:8px 8px;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:.75}70%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--text-2);white-space:nowrap}
.chip.work{background:var(--work-soft);color:var(--work)}.chip.ask{background:var(--ask-soft);color:var(--ask);box-shadow:inset 0 0 0 1px var(--ask-line)}.chip.fail{background:var(--fail-soft);color:var(--fail)}

/* ---------- work header ---------- */
.work{display:flex;min-height:0;position:relative}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.whead{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none;min-width:0}
.scope{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 9px;border-radius:9px;font-weight:700;font-size:15px;white-space:nowrap}
.scope:hover{background:var(--hover-2)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunken);border:1px solid var(--line);flex:none}
.seg button{height:28px;padding:0 11px;border-radius:7px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.seg .n{color:var(--text-3);font-weight:500}.seg .n.ask{color:var(--ask);font-weight:700}
.find{display:flex;align-items:center;gap:8px;height:34px;width:220px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text-3)}
.find input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--text)}
.lens{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--sunken);border:1px solid var(--line)}
.lens button{height:30px;padding:0 13px;border-radius:8px;display:flex;align-items:center;gap:7px;font-weight:700;color:var(--text-2)}
.lens button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.focusbar{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 11px;border-radius:999px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid var(--accent-line);color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap;max-width:420px;min-width:0}
/* ---------- the body: outline over a map that is always there ---------- */
.wbody{flex:1;min-height:0;position:relative;overflow:hidden}
.outline{position:absolute;left:0;top:0;bottom:0;z-index:3;width:100%;background:var(--surface);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.outline.wide{background:var(--bg);padding-bottom:24px}
.lens-map .outline{width:var(--olw);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.05)}
.lens-map.ol-hidden .outline{width:0;border:0;visibility:hidden}
.lens-list .mappane *{animation-play-state:paused}
.mappane{position:absolute;inset:0;background:var(--map);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;overflow:hidden;cursor:grab;touch-action:none}
.mappane.drag{cursor:grabbing}
.mappane::before,.mappane::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none}
.mappane::before{left:0;background:linear-gradient(90deg,var(--map),transparent)}
.mappane::after{right:0;background:linear-gradient(270deg,var(--map),transparent)}
/* ---------- outline (one component, two densities) ---------- */
.ol-sec{display:flex;align-items:center;gap:8px;height:34px;padding:0 18px;margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);position:sticky;top:0;background:var(--surface);z-index:1}
.ol-sec .n{letter-spacing:0;color:var(--text-4)}
.ol-sec.sec-needs{color:var(--ask)}
.wide .ol-sec{background:var(--bg);padding:0 22px;height:40px;margin-top:2px}
.wide .ol-cols{padding:0 33px 0 25px;border-bottom:0;height:26px;margin-top:6px}
.tcard{margin:0 14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);overflow:hidden;padding:3px 0}
.compact .tcard{margin:0;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0 0 4px}
.ol-cols{display:grid;grid-template-columns:minmax(0,2.1fr) 210px minmax(0,1.7fr) 72px;column-gap:18px;padding:0 18px;height:30px;align-items:center;font-size:11.5px;color:var(--text-3);font-weight:600;border-bottom:1px solid var(--line-3)}
.compact .ol-cols{display:none}
.row{display:grid;grid-template-columns:minmax(0,2.1fr) 210px minmax(0,1.7fr) 72px;column-gap:18px;align-items:center;min-height:46px;padding:0 18px 0 10px;cursor:pointer;position:relative}
.row:hover,.row.hl{background:var(--hover)}
.row[aria-selected=true]{background:var(--accent-soft)}
.row[aria-selected=true]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.row.root{min-height:54px}
.row.root+.row:not(.root){}
.row.dim{opacity:.4}
.c-main{display:flex;align-items:center;min-width:0;align-self:stretch}
.g{flex:none;width:22px;align-self:stretch;position:relative}
.g.v::before,.g.tee::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:1.5px solid var(--thread)}
.g.el::after,.g.tee::after{content:"";position:absolute;left:10px;top:0;height:50%;width:9px;border-left:1.5px solid var(--thread);border-bottom:1.5px solid var(--thread);border-bottom-left-radius:8px}
.fold{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);margin-right:2px}
.fold:hover{background:var(--hover-2);color:var(--text)}
.fold-pad{flex:none;width:24px}
.c-main .bead{margin-right:9px}
.r-title{min-width:0;flex:1;font-weight:600;line-height:1.3;text-align:left;padding:6px 0}
.root .r-title{font-size:14.5px}
.r-title .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-title .sub{display:block;font-size:12px;font-weight:500;color:var(--text-3);margin-top:1px}
.r-title.removed .t{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.c-who{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;color:var(--text-2)}
.c-who .w{min-width:0}
.c-who .w b{display:block;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-who .w small{display:block;font-size:11.5px;color:var(--text-3)}
.c-now{font-size:13px;min-width:0;line-height:1.35}
.c-now .l{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .3s}
.c-now .l.fade{opacity:0}
.c-now .l2{display:block;font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-time{font-size:12.5px;color:var(--text-3);text-align:right;white-space:nowrap}
.row .quick{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;gap:4px;padding-left:10px;background:linear-gradient(90deg,transparent,var(--hover) 12px)}
.row:hover .quick{display:flex}
.row[aria-selected=true] .quick{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 6%,var(--surface)) 12px)}
.compact .row{grid-template-columns:minmax(0,1fr);min-height:36px;padding:0 10px 0 6px}
.compact .row.root{min-height:42px}
.compact .c-who,.compact .c-now,.compact .c-time,.compact .quick,.compact .r-title .sub{display:none!important}
.compact .r-title{font-size:13.5px;font-weight:500;padding:4px 0}
.compact .root .r-title{font-size:13.5px;font-weight:700}
.compact .ol-sec{padding:0 14px;height:30px;font-size:11px}
.compact .attn-dot{display:inline-flex}
.attn-dot{display:none;flex:none;margin-left:6px;width:8px;height:8px;border-radius:50%;background:var(--ask-fill)}
.ol-empty{padding:28px 20px;color:var(--text-3)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px 10px 18px;font-size:12.5px;color:var(--text-3)}
.crumbs .focusbar{height:24px;padding:0 9px;font-size:12px}
.crumbs button{color:var(--text-2);font-weight:600}.crumbs button:hover{color:var(--text)}
/* ---------- map ---------- */
.minner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--thread);stroke-width:1.6}
.edges path.e-work{stroke:var(--work);stroke-opacity:.55;stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
.edges path.e-ask{stroke:var(--ask-fill);stroke-width:2}
.edges path.e-gone{stroke-dasharray:2 5;stroke:var(--text-4)}
.edges path.e-fail{stroke:var(--fail);stroke-opacity:.6}
.edges path.dim{opacity:.18}
@keyframes flow{to{stroke-dashoffset:-12}}
.gn{position:absolute;width:168px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 6px 8px;border-radius:14px;transform-origin:50% 29px;transition:background .15s}
.gn:hover,.gn.hl{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.gav{position:relative;display:grid;place-items:center;border-radius:50%}
.gav .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--work);opacity:.55;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{50%{opacity:.12;transform:scale(1.07)}}
.gav .ring.ask{border-color:var(--ask-fill);opacity:.9;animation:none}
.gav .ring.idle{border:1.5px dashed var(--text-4);animation:none;opacity:1}
.gav .ring.sel{border:2.5px solid var(--accent);opacity:1;animation:none;inset:-7px}
.gav .badge{position:absolute;right:-9px;top:-9px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px var(--map)}
.gav .badge.ask{background:var(--ask-fill);color:#2a1b00}.gav .badge.fail{background:var(--fail);color:#fff}.gav .badge.block{background:var(--block);color:#fff}.gav .badge.paused{background:var(--ask-fill);color:#2a1b00}.gav .badge.done{background:var(--surface);color:var(--text-2);border:1px solid var(--line-2)}
.gn .gt{font-weight:600;font-size:13px;line-height:1.3;max-width:156px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gn.root .gt{font-size:14px;font-weight:700}
.gn .gt.removed{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.gn .gs{font-size:12px;font-weight:600;margin-top:-2px}
.gn .gproj{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.gn .gfold{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);font-size:11.5px;font-weight:700;color:var(--text-2);margin-top:2px}
.gn[aria-pressed=true] .gt{color:var(--accent)}
.gn.dim{opacity:.22}
.minner.far .gn .gs{display:none}
.minner.far .gn:not(.root) .gt{-webkit-line-clamp:1}
.mtool{position:absolute;top:14px;z-index:2;display:flex;align-items:center;gap:8px}
.mcard{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);font-weight:600;white-space:nowrap;max-width:440px}
.mctl{position:absolute;bottom:16px;z-index:2;display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2)}
.mctl .pct{min-width:48px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--text-2)}
.mini{position:absolute;right:16px;bottom:16px;z-index:2;width:196px;height:118px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);overflow:hidden;cursor:pointer}
.mini svg{display:block}
.gav .badge.done.rv{background:var(--work);color:#fff;border:0}
.gr{position:absolute;width:208px;height:52px;display:flex;align-items:center;gap:10px;padding:0 10px 0 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);text-align:left;transition:border-color .15s,box-shadow .15s}
.gr:hover,.gr.hl{border-color:var(--line-2)}
.gr[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gr.gr-ask{border-color:var(--ask-line);background:color-mix(in srgb,var(--ask-fill) 8%,var(--surface))}
.gr .grt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.gr .t{font-weight:600;font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .t.removed{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.gr .s{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gav .ring{inset:-4px;border-width:1.5px}
.gr .gav .badge{width:17px;height:17px;right:-6px;top:-6px;box-shadow:0 0 0 2px var(--surface)}
.gr.dim{opacity:.22}
.minner.far .gr .s{display:none}
.mbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);font-weight:600;color:var(--text-2);white-space:nowrap}
.mbtn:hover,.mbtn[aria-pressed=true]{color:var(--text)}
.mtool .focusbar{height:36px;border-radius:10px;box-shadow:var(--shadow-1)}
.ghosts{position:fixed;inset:0;z-index:80;pointer-events:none}
.ghosts .av{position:fixed;transform-origin:50% 50%;box-shadow:0 8px 22px rgba(0,0,0,.2)}
/* ---------- inspector ---------- */
.insp{flex:none;width:var(--insp-w);border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;position:relative;z-index:5}
.insp.enter{animation:inspIn .26s var(--ease)}
@keyframes inspIn{from{opacity:0;transform:translateX(16px)}}
.resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:6}
.resize::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity .15s}
.resize:hover::after,.resize.on::after{opacity:.6}
.ih{padding:16px 16px 14px 18px;border-bottom:1px solid var(--line)}
.ih-row{display:flex;align-items:flex-start;gap:12px}
.ih h2{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.ih .role{font-size:12.5px;color:var(--text-3);margin-top:3px}
.ih .state{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;font-weight:600}
.ih .state .muted{color:var(--text-3);font-weight:500}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.tab{height:40px;padding:0 9px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.ibody{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px}
.ifoot{flex:none;display:flex;gap:6px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.blk{margin-bottom:20px}
.blk h3{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.blk h3 .link{text-transform:none;letter-spacing:0;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.blk h3 .link:hover{color:var(--text)}
.qcard{border-radius:12px;padding:14px;background:var(--ask-soft);border:1px solid var(--ask-line)}
.qcard .qh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ask);margin-bottom:7px}
.qcard .qt{font-size:15px;line-height:1.5}
.qcard textarea{width:100%;min-height:74px;margin-top:11px;border-radius:9px;border:1px solid var(--ask-line);background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.45}
.qcard .acts{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.note{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;line-height:1.5}
.note.fail{background:var(--fail-soft);border-color:color-mix(in srgb,var(--fail) 30%,var(--line))}
.note.block{border-color:color-mix(in srgb,var(--block) 35%,var(--line))}
.resp{display:block;width:100%;text-align:left;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.resp:hover{border-color:var(--line-2)}
.resp .rt{font-weight:600;line-height:1.35}
.resp .rm{font-size:12.5px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:6px}
.live{border-radius:12px;background:var(--sunken);border:1px solid var(--line);padding:10px 12px;font:12px/1.65 var(--mono);color:var(--text-2)}
.live div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .k{color:var(--text-4);display:inline-block;width:44px}
.live .cur{color:var(--text)}
.fam{border-radius:12px;border:1px solid var(--line);background:var(--map);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;padding:6px}
.fam svg{display:block;width:100%}
.fam .fnode{cursor:pointer}
.kids{display:grid;gap:2px}
.kid{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;text-align:left;width:100%}
.kid:hover{background:var(--hover)}
.kid .kt{font-weight:600;font-size:13.5px}
.kid.team{grid-template-columns:16px 24px minmax(0,1fr) auto}
.kid .kt.removed{text-decoration:line-through;color:var(--text-3)}
.tl{display:grid}
.tl-i{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:0 0 14px;position:relative}
.tl-i::before{content:"";position:absolute;left:9px;top:20px;bottom:0;border-left:1.5px solid var(--thread-soft)}
.tl-i:last-child::before{display:none}
.tl-d{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--thread);color:var(--text-2)}
.tl-t{font-size:13.5px;line-height:1.45}.tl-t small{display:block;color:var(--text-3);font-size:12.5px}
.tl-time{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.out{border-radius:12px;background:var(--sunken);border:1px solid var(--line);font:12px/1.7 var(--mono);padding:8px 0;color:var(--text-2)}
.out div{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:0 12px;white-space:pre-wrap;word-break:break-word}
.out .k{color:var(--text-4)}.out .ok{color:var(--work)}.out .ctl{color:var(--accent)}
.set{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.set-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface)}
.set-r+.set-r{border-top:1px solid var(--line-3)}
.set-r b{display:block;font-weight:600}.set-r small{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s var(--ease)}
.sw[aria-checked=true]{background:var(--ink)}.sw[aria-checked=true]::after{transform:translateX(14px);background:var(--on-ink)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:13px}.kv dt{color:var(--text-3)}.kv dd{margin:0;min-width:0;word-break:break-all}
/* ---------- pages ---------- */
.page{overflow:auto;height:100%}
.pwrap{max-width:1180px;margin:0 auto;padding:26px 32px 72px}
.pcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);margin-bottom:12px;flex-wrap:wrap}
.pcrumb button{color:var(--text-2);font-weight:600;display:inline-flex;align-items:center;gap:4px}.pcrumb button:hover{color:var(--text)}
.ptitle{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.psub{color:var(--text-2);margin-top:6px;font-size:15px}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;color:var(--text-3);font-size:13.5px}
.banner{display:flex;align-items:center;gap:12px;margin:20px 0 24px;padding:14px 18px;border-radius:14px;font-size:15px;font-weight:500}
.banner.ask{background:var(--ask-soft);border:1px solid var(--ask-line)}
.banner.ok{background:var(--work-soft);border:1px solid color-mix(in srgb,var(--work) 30%,transparent)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.card-h h2{font-size:15px;font-weight:700}
.card-b{padding:8px 18px 18px}
.prose{font-size:15.5px;line-height:1.65}
.steps .st{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:10px 0;position:relative}
.steps .st:not(:last-child)::before{content:"";position:absolute;left:10px;top:34px;bottom:-4px;border-left:1.5px solid var(--thread-soft)}
.steps .sd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--text-2)}
.steps b{font-weight:600}.steps small{display:block;color:var(--text-2);font-size:13.5px;margin-top:1px}
.steps .tm{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.say{border-left:3px solid var(--line-2);padding:4px 0 4px 16px;font-size:15.5px;line-height:1.6}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;font-size:14.5px}
.ck+.ck{border-top:1px dashed var(--line)}
.ck small{display:block;color:var(--text-3);font-size:13px}
.mini-lens{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);margin-left:auto}
.mini-lens button{height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;color:var(--text-2)}
.mini-lens button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
/* new task */
.compose{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:24px;align-items:start}
.write{padding:6px 0 0}
.write textarea{width:100%;min-height:250px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 20px;font-size:17px;line-height:1.6;resize:vertical;box-shadow:var(--shadow-1)}
.write textarea:focus{border-color:var(--line-2);box-shadow:0 0 0 4px var(--accent-soft)}
.starts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.starts button{height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--line-2);color:var(--text-2);font-weight:600;font-size:13px}
.starts button:hover{border-style:solid;color:var(--text)}
.field{margin-top:22px}
.field>label,.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:96px}
.tool[aria-checked=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.tool[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.tool b{font-weight:700}.tool small{font-size:12px;color:var(--text-3);line-height:1.35}
.side{position:sticky;top:20px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0}
.opt+.opt{border-top:1px solid var(--line-3)}
.opt b{display:block;font-weight:600}.opt small{display:block;color:var(--text-3);font-size:12.5px;margin-top:1px}
.segc{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--sunken);border:1px solid var(--line)}
.segc button{height:28px;padding:0 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.segc button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.preview{margin-top:16px;border-radius:14px;border:1px solid var(--line);background:var(--map);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;padding:14px}
.summary{font-size:14px;color:var(--text-2);line-height:1.55;margin-top:12px}.summary b{color:var(--text)}
.select{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:600}
/* connections */
.prov{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:18px;align-items:start;padding:20px 22px}
.prov+.prov{border-top:1px solid var(--line-3)}
.plogo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#17181B}
.prov h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.prov .lead{font-size:15px;line-height:1.55;margin-top:6px;color:var(--text)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--sunken);font-size:12.5px;color:var(--text-2)}
.fact.ok svg{color:var(--work)}.fact.warn svg{color:var(--ask)}
.pacts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:170px}
.confirmb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ask-soft);border:1px solid var(--ask-line);font-size:13.5px;display:grid;gap:10px}
.confirmb label{display:flex;gap:9px;align-items:flex-start}
.review{margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2)}
.cmd{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--sunken);border:1px solid var(--line);font:13px/1.4 var(--mono)}
/* settings */
.sgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.sidx{position:sticky;top:24px;display:grid;gap:2px}
.sidx button{height:34px;padding:0 12px;border-radius:8px;text-align:left;font-weight:600;color:var(--text-2)}
.sidx button[aria-current=true],.sidx button:hover{background:var(--hover-2);color:var(--text)}
.ssec{margin-bottom:18px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.theme{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--surface)}
.theme[aria-checked=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.theme .pv{height:86px;border-radius:9px;overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:34% 1fr}
.theme .lbl{display:flex;align-items:center;gap:7px;margin-top:9px;font-weight:600}
.pv-l{background:#fff}.pv-l .a{background:#F3F2EE}.pv-d{background:#16171B}.pv-d .a{background:#0E0F12}
.pv .a{display:grid;align-content:start;gap:5px;padding:8px}.pv .a i{height:6px;border-radius:3px;background:rgba(127,127,127,.35)}
.pv .b{position:relative}.pv .b i{position:absolute;width:14px;height:14px;border-radius:50%}
.projrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.projrow+.projrow{border-top:1px solid var(--line-3)}
.pi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2)}
.inputrow{display:flex;gap:8px;margin-top:12px}
.inputrow input{flex:1;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font:13px var(--mono)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;font-size:13.5px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line-3)}
/* projects */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.pcard{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.pcard h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.pcard .stats{display:flex;gap:14px;font-size:13px;color:var(--text-2)}
.pcard .stats b{font-size:18px;display:block;color:var(--text)}
.pthumb{height:128px;border-radius:12px;background:var(--map);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:14px 14px;border:1px solid var(--line-3);display:grid;place-items:center;padding:12px;overflow:hidden}
.pthumb path{fill:none;stroke:var(--thread);stroke-width:1.4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--on-ink);box-shadow:var(--shadow-3);font-size:13.5px;max-width:min(640px,92vw)}
.pop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-3);padding:6px;min-width:240px;animation:popIn .14s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}}
.pop button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border-radius:8px;font-weight:500}
.pop button:hover{background:var(--hover-2)}
.pop .ph{padding:8px 10px 4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
/* responsive */
/* ---------- refinement round 1: New Task lead/children, project picker, Connections ---------- */
.grp{padding:4px 0 6px}.grp+.grp{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.grp-s{font-size:12.5px;color:var(--text-3)}
.leadrow{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:6px 0 2px;border-radius:12px;background:var(--sunken);border:1px solid var(--line-3)}
.leadtxt b{display:block;font-weight:700}.leadtxt small{display:block;color:var(--text-2);font-size:13px}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;height:34px;padding:0 32px 0 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;cursor:pointer;max-width:210px}
.sel select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sel .ic{position:absolute;right:10px;pointer-events:none;color:var(--text-3)}
.segc button{min-height:30px}.segc button:focus-visible{outline-offset:0}
.segc.wide{display:flex;width:100%}.segc.wide button{flex:1;height:34px}
.dim-val{font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.optcol{display:grid;gap:9px;padding:8px 0 4px}.optcol>b{font-weight:600}
.expl{font-size:13px;line-height:1.5;color:var(--text-2)}.expl.sub{font-size:12.5px;color:var(--text-3)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 6px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px}
.pchip.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.pchip[aria-disabled=true]{opacity:.5;cursor:not-allowed;border-style:dashed}
.why{font-size:12.5px;color:var(--text-3);line-height:1.45}
.note-i{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--text-2);padding:9px 11px;border-radius:10px;background:var(--sunken)}
.note-i .ic{margin-top:2px;color:var(--text-3)}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}

      ready:[fact('ok','Installed 0.9.0'),fact('warn','Sign-in can’t be checked','Gemini CLI has no sign-in status command; its settings select Google sign-in.'),fact('no','Not enabled or allowed for tasks'),fact('warn','Billing route: not verified','Only what its settings select.')],
      usage:`<p class="cu-src">Gemini CLI exposes no usage or quota information.</p><ul class="cfl">${fact('info','Remaining usage: unknown')}${fact('info','Limits: not detected','Its failures can’t be told apart from quota limits.')}${fact('info','Reset time: unknown')}</ul>`,
      paid:`<p>With Google sign-in, Gemini CLI uses your account’s daily allowance. A Gemini API key or Vertex AI would bill through Google instead. Where to check:</p><ol class="steps2"><li>In Gemini CLI, run <b>/auth</b> to see which sign-in it uses.</li><li>Compare it with the quota and pricing guide.</li></ol>`,

        <div class="kid" style="cursor:default">${bead('done')}<span><span class="kt">Installed · Claude Code 2.1.280</span><small style="display:block;color:var(--text-3);font-size:12px">Succeeded</small></span><span class="c-time">Oct 21</span></div>

function forestThumb(pk){

  if(e.key==='m'||e.key==='M'){switchLens('map');return}
  if(e.key==='f'||e.key==='F'){if(S.sel){S.focus=S.sel;render();syncUrl();if(S.lens==='map')fitIds(treeIds(S.focus))}return}
  const nodeNav=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key);if(!nodeNav||!S.sel)return;
  e.preventDefault();const n=BY[S.sel];
  if(S.lens==='list'||t.closest('[data-outline]')){
    const ids=[...document.querySelectorAll('.row[data-id]')].map(r=>r.dataset.id);const i=ids.indexOf(S.sel);
    if(e.key==='ArrowDown'&&i<ids.length-1)select(ids[i+1]);else if(e.key==='ArrowUp'&&i>0)select(ids[i-1]);
    else if(e.key==='ArrowRight'){if(visibleKids(n.id).length&&!S.expanded.has(n.id)){S.expanded.add(n.id);render()}else if(visibleKids(n.id).length)select(visibleKids(n.id)[0].id)}
    else if(e.key==='ArrowLeft'){if(S.expanded.has(n.id)&&visibleKids(n.id).length){S.expanded.delete(n.id);render()}else if(n.parent)select(n.parent)}
  }else{
    const sib=n.parent?visibleKids(n.parent):rootsVisible();const i=sib.findIndex(s=>s.id===n.id);
    if(e.key==='ArrowUp'&&n.parent)select(n.parent);else if(e.key==='ArrowDown'&&visibleKids(n.id).length){S.expanded.add(n.id);select(visibleKids(n.id)[0].id)}
    else if(e.key==='ArrowRight'&&i<sib.length-1)select(sib[i+1].id);else if(e.key==='ArrowLeft'&&i>0)select(sib[i-1].id);
  }
  setTimeout(()=>document.querySelector(S.lens==='list'?'.row[aria-selected=true]':`[data-map] [data-id="${S.sel}"]`)?.focus({preventScroll:true}),0);
});
/* map: drag to pan, wheel to zoom, double-click to focus a branch */
let drag=null,dragMoved=false;
document.addEventListener('pointerdown',e=>{
  const r=e.target.closest('[data-resize]');if(r){drag={k:'w',x:e.clientX,w:S.inspW,el:r};r.classList.add('on');r.setPointerCapture(e.pointerId);return}
  const mp=e.target.closest('.mappane');if(mp&&!e.target.closest('.mtool,.mctl,.mini')&&S.cam){drag={k:'pan',x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y};dragMoved=false}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.k==='w'){S.inspW=Math.max(340,Math.min(600,drag.w-(e.clientX-drag.x)));const i=document.querySelector('.insp');if(i)i.style.setProperty('--insp-w',S.inspW+'px')}
  if(drag.k==='pan'){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){dragMoved=true;document.querySelector('.mappane')?.classList.add('drag')}if(dragMoved){S.cam={...S.cam,x:drag.cx+dx,y:drag.cy+dy};applyCam(false)}}
});
document.addEventListener('pointerup',()=>{if(!drag)return;if(drag.k==='w')drag.el.classList.remove('on');document.querySelector('.mappane')?.classList.remove('drag');drag=null;setTimeout(()=>dragMoved=false,0)});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-resize]')){S.inspW=404;render();return}const g=e.target.closest('[data-map] [data-id]');if(g){S.focus=g.dataset.id;render();syncUrl();fitIds(treeIds(S.focus))}});
function zoomBy(f,cx,cy){if(!S.cam)return;const v=visRect();cx=cx??v.l+v.w/2;cy=cy??v.h/2;const k=Math.max(.35,Math.min(1.6,S.cam.k*f));S.cam={k,x:cx-(cx-S.cam.x)*k/S.cam.k,y:cy-(cy-S.cam.y)*k/S.cam.k};applyCam(true)}
document.addEventListener('wheel',e=>{const mp=e.target.closest('.mappane');if(!mp||e.target.closest('.mini'))return;e.preventDefault();const r=mp.getBoundingClientRect();zoomBy(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
window.addEventListener('resize',()=>{if(S.route==='work'&&S.lens==='map'){fitTree(false);applyCam(false)}});
/* liveness: the latest line of each working agent (stand-in for its output stream) */
let tick=0;setInterval(()=>{tick++;document.querySelectorAll('[data-live]').forEach(el=>{const n=BY[el.dataset.live];if(!n.live||n.live.length<2)return;el.classList.add('fade');setTimeout(()=>{el.textContent=n.live[tick%n.live.length];el.classList.remove('fade')},300)})},4200);

/* ---------------- refinement round 1: New Task and Connections controls ---------------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-nt]');
  if(!el){if(S.nt.pop&&!e.target.closest('.pjpop')){S.nt.pop=false;render()}return}
  if(el.getAttribute('aria-disabled')==='true'||el.disabled)return;
  e.stopPropagation();const a=el.dataset.nt,v=el.dataset.v,d=S.draft;
  if(a==='tool'){d.tool=v;d.model=CAT[v].dflt;const m=modelOf(v,d.model);d.effort=m&&m.efforts&&m.efforts.length?m.def:null}
  else if(a==='effort')d.effort=v;
  else if(a==='access')d.access=v;
  else if(a==='deleg')d.deleg=!d.deleg;
  else if(a==='alloc')d.alloc=v;
  else if(a==='auto')d.auto=d.auto.includes(v)?d.auto.filter(x=>x!==v):[...d.auto,v];
  else if(a==='pjpop'){S.nt.pop=!S.nt.pop;S.nt.q=''}
  else if(a==='pjpick'){d.project=v;S.nt.pop=false}
  else if(a==='browse'){S.nt.pop=false;S.nt.drop=null;S.nt.modal={sel:null,typing:false}}
  else if(a==='closemodal')S.nt.modal=null;
  else if(a==='fsel')S.nt.modal={...S.nt.modal,sel:v};
  else if(a==='typepath')S.nt.modal={...S.nt.modal,typing:true};
  else if(a==='usefolder')addFolder(FOLDERS.find(f=>f.name===S.nt.modal.sel));
  else if(a==='simdrop')S.nt.drop=FOLDERS.find(f=>f.name===v);
  else if(a==='adddrop')addFolder(S.nt.drop);
  else if(a==='cleardrop')S.nt.drop=null;
  else if(a==='conn')S.conn=(S.conn||'claude')===v?'_':v;
  render();
  if(a==='browse')document.querySelector('.fm-i')?.focus();
  if(a==='pjpop'&&S.nt.pop)document.querySelector('.pjsearch input')?.focus();
  if(['closemodal','usefolder','pjpick','adddrop','cleardrop'].includes(a))document.querySelector('.pj')?.focus();
},true);
document.addEventListener('change',e=>{if(e.target.dataset.ntsel==='model'){const d=S.draft;d.model=e.target.value;const m=modelOf(d.tool,d.model);d.effort=m&&m.efforts&&m.efforts.length?(m.efforts.includes(d.effort)?d.effort:m.def):null;render();document.querySelector('[data-ntsel="model"]')?.focus()}});
document.addEventListener('input',e=>{if(e.target.dataset.ntin==='q'){S.nt.q=e.target.value;render();const i=document.querySelector('.pjsearch input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.nt.modal){S.nt.modal=null}else if(S.nt.pop){S.nt.pop=false}else return;e.stopImmediatePropagation();render();document.querySelector('.pj')?.focus()},true);
/* drag a folder from File Explorer: the browser shows the drop state, but the folder itself is simulated */
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(S.route!=='new')return;e.preventDefault();dragDepth++;if(S.nt.drop!=='over'){S.nt.drop='over';render()}});
window.addEventListener('dragover',e=>{if(S.route==='new')e.preventDefault()});
window.addEventListener('dragleave',()=>{if(S.route!=='new')return;if(--dragDepth<=0){dragDepth=0;if(S.nt.drop==='over'){S.nt.drop=null;render()}}});
window.addEventListener('drop',e=>{if(S.route!=='new')return;e.preventDefault();dragDepth=0;S.nt.drop=FOLDERS.find(f=>f.name==='docs-site');toast('Simulated: a browser can’t pass a real folder path, so the prototype checks docs-site.')});
/* ---------------- boot ---------------- */
readHash();applyTheme();
if(!location.hash)history.replaceState(null,'','#/work?lens=list&sel=t1');
render({reveal:true});
if(S.route==='work'&&S.freeze!==null){const target=S.lens;S.lens=target==='map'?'list':'map';render();switchLens(target,{freeze:S.freeze})}
if(S.scrollTo)document.getElementById(S.scrollTo)?.scrollIntoView({block:'start'});
</script>
